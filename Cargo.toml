[workspace]
members = [
    "zcash_voting",
    "vote-commitment-tree",
    "vote-commitment-tree-client",
    "wallet-example",
]
resolver = "2"

[workspace.dependencies]
# orchard, voting-circuits, and librustzcash all resolve to the same Orchard
# release, keeping the dependency graph type-compatible across PCZT construction
# and vote proofs.
orchard = { version = "0.15.4", features = ["unstable-voting-circuits"] }
voting-circuits = "0.9.0-rc.3"

# These published librustzcash versions include the Ironwood historical selector.
pczt = { version = "0.9.2", features = ["orchard", "io-finalizer", "signer", "zcp-builder"] }
zcash_client_backend = { version = "0.24.0-rc.7", default-features = false, features = ["orchard", "lightwalletd-tonic", "lightwalletd-tonic-tls-webpki-roots"] }
zcash_client_sqlite = { version = "0.22.0-rc.7", default-features = false, features = ["orchard"] }
zcash_keys = { version = "0.16.1", features = ["orchard"] }
zcash_primitives = { version = "0.30.0" }
zcash_protocol = { version = "0.10.4" }

[patch.crates-io]
pczt = { git = "https://github.com/zcash/librustzcash", rev = "7db76db2afa2dbd355faf09a599339c94b264e31" }
zcash_address = { git = "https://github.com/zcash/librustzcash", rev = "7db76db2afa2dbd355faf09a599339c94b264e31" }
zcash_client_backend = { git = "https://github.com/zcash/librustzcash", rev = "7db76db2afa2dbd355faf09a599339c94b264e31" }
zcash_client_sqlite = { git = "https://github.com/zcash/librustzcash", rev = "7db76db2afa2dbd355faf09a599339c94b264e31" }
zcash_keys = { git = "https://github.com/zcash/librustzcash", rev = "7db76db2afa2dbd355faf09a599339c94b264e31" }
zcash_pool_migration = { git = "https://github.com/zcash/librustzcash", rev = "7db76db2afa2dbd355faf09a599339c94b264e31" }
zcash_primitives = { git = "https://github.com/zcash/librustzcash", rev = "7db76db2afa2dbd355faf09a599339c94b264e31" }
zcash_proofs = { git = "https://github.com/zcash/librustzcash", rev = "7db76db2afa2dbd355faf09a599339c94b264e31" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash", rev = "7db76db2afa2dbd355faf09a599339c94b264e31" }
zcash_transparent = { git = "https://github.com/zcash/librustzcash", rev = "7db76db2afa2dbd355faf09a599339c94b264e31" }
zip321 = { git = "https://github.com/zcash/librustzcash", rev = "7db76db2afa2dbd355faf09a599339c94b264e31" }
